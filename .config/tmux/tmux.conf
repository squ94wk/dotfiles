# 24bit colors
set -g default-terminal "wezterm"
set-option -ga terminal-overrides ",wezterm:Tc"

set -g display-panes-time 2000
set-option -g repeat-time 300

set -g pane-border-status top
set -g pane-border-format "#{pane_title}"

# Mouse support
set -g mouse on
set -g @yank_with_mouse off

# Vim mode for scrolling
set-window-option -g mode-keys vi

# Track KUBECONFIG in tmux environment
set -ga update-environment " KUBECONFIG"

# Bindings
bind-key S setw synchronize-panes

# don't reflow panes on an accidental prefix + Space
unbind -T prefix Space

bind '"' split-window -v -c "#{pane_current_path}" -e KUBECONFIG
bind '%' split-window -h -c "#{pane_current_path}" -e KUBECONFIG

# disable sound bell
set -g bell-action none
# disable visual bell (screen flash)
set -g visual-bell off

# Status Bar
set-option -g status-interval 2
set-option -g status-left-length 30

# Plugins
run-shell ${XDG_CONFIG_HOME}/tmux/plugins/tmux-sensible/sensible.tmux
